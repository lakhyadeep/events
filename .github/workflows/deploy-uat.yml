name: Deploy to UAT

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run automated tests before deploying'
        required: true
        type: boolean
        default: true

concurrency:
  group: uat-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.run_tests == true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test --compact

  build-assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Upload Vite Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1

  deploy:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    needs: [test, build-assets]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.build-assets.result == 'success'
    steps:
      - name: Download Vite Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.UAT_SSH_PORT || 22 }} -H "${{ secrets.UAT_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Code & Sync Compiled Assets
        env:
          SSH_HOST: ${{ secrets.UAT_SSH_HOST }}
          SSH_USER: ${{ secrets.UAT_SSH_USER }}
          SSH_PORT: ${{ secrets.UAT_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.UAT_DEPLOY_PATH }}
        run: |
          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"

          echo "===> Putting application into maintenance mode and pulling develop..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "export TERM=dumb; cd $DEPLOY_PATH && if [ -f artisan ]; then php artisan down --render='errors::503' || true; fi && git fetch origin develop && git reset --hard origin/develop && composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev"

          echo "===> Syncing compiled Vite assets via rsync..."
          rsync -avz --delete -e "$SSH_CMD" public/build/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build/"

          echo "===> Running migrations, permissions, and optimization caches..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "export TERM=dumb; cd $DEPLOY_PATH && chmod -R 775 storage bootstrap/cache || true && php artisan storage:link || true && php artisan migrate --force && php artisan optimize:clear && php artisan optimize && php artisan view:cache && php artisan event:cache && php artisan queue:restart || true && php artisan up"

