name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run automated tests before deploying'
        required: true
        type: boolean
        default: true

concurrency:
  group: uat-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    if: inputs.run_tests == true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test --compact

  deploy:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.UAT_SSH_PORT || 22 }} -H "${{ secrets.UAT_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Code & Sync Compiled Assets
        env:
          SSH_HOST: ${{ secrets.UAT_SSH_HOST }}
          SSH_USER: ${{ secrets.UAT_SSH_USER }}
          SSH_PORT: ${{ secrets.UAT_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.UAT_DEPLOY_PATH }}
        run: |
          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"

          echo "===> Putting application into maintenance mode if already installed..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "export TERM=dumb; if [ -d $DEPLOY_PATH ] && [ -f $DEPLOY_PATH/artisan ]; then cd $DEPLOY_PATH && php artisan down --render='errors::503' || true; fi" || true

          echo "===> Verifying compiled Vite assets..."
          ls -la public/build

          echo "===> Streaming complete application codebase and assets to server..."
          tar --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='storage/*.sqlite' -czf - . | $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH && tar -xzf - -C $DEPLOY_PATH"

          echo "===> Running Composer, migrations, permissions, and caches on server..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "export TERM=dumb; cd $DEPLOY_PATH && {
            if [ ! -f .env ]; then
              echo 'Setting up initial .env file...'
              if [ -f .env.production.example ]; then
                cp .env.production.example .env
              else
                cp .env.example .env
              fi
            fi

            if [ -f .htaccess.root-example ]; then
              cp .htaccess.root-example .htaccess
            fi

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            if ! grep -q '^APP_KEY=base64:' .env; then
              php artisan key:generate --force || true
            fi

            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache
            touch database/database.sqlite 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            php artisan event:cache
            php artisan route:clear
            rm -f bootstrap/cache/routes-v7.php
            php artisan queue:restart || true
            php artisan up
          }"
