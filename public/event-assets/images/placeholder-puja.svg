<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Background Festive Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220306" />
      <stop offset="45%" stop-color="#3d070e" />
      <stop offset="80%" stop-color="#2a0409" />
      <stop offset="100%" stop-color="#140103" />
    </linearGradient>

    <!-- Warm Golden Radial Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#78350f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ornate Gold Gradient for Pandal Architecture -->
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fffbeb" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Diya Flame Radial Gradient -->
    <radialGradient id="flameGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Festive Mandala Pattern in Background -->
  <g opacity="0.12" stroke="#fbbf24" stroke-width="1.2" fill="none">
    <circle cx="300" cy="165" r="135" stroke-dasharray="4 4" />
    <circle cx="300" cy="165" r="105" />
    <circle cx="300" cy="165" r="75" stroke-dasharray="3 3" />
    <circle cx="300" cy="165" r="45" />
    <!-- Ray Petals -->
    <path d="M 300,30 L 300,300 M 165,165 L 435,165 M 205,70 L 395,260 M 395,70 L 205,260" stroke-width="0.8" />
  </g>

  <!-- Radiant Central Glow -->
  <rect width="600" height="360" fill="url(#auraGlow)" />

  <!-- Pandal Architectural Temple Arches -->
  <g opacity="0.32" stroke="url(#goldArch)" stroke-width="1.6" fill="none">
    <!-- Outer Temple Spire -->
    <path d="M 120,310 L 120,210 Q 120,135 210,120 Q 300,60 300,42 Q 300,60 390,120 Q 480,135 480,210 L 480,310" />
    <!-- Mid Mandap Arch -->
    <path d="M 165,310 L 165,220 Q 165,155 240,140 Q 300,95 300,82 Q 300,95 360,140 Q 435,155 435,220 L 435,310" />
    <!-- Base Platform Tier -->
    <path d="M 80,310 L 520,310" stroke-width="2.5" />
    <path d="M 100,318 L 500,318" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Maa Durga Icon & Mukut Emblem at Center -->
  <g transform="translate(300, 150)">
    <!-- Aura Ring -->
    <circle cx="0" cy="-5" r="48" fill="rgba(251, 191, 36, 0.12)" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 3" />

    <!-- Trishul (Trident) & Mukut Silhouette -->
    <!-- Mukut Crown Silhouette -->
    <path d="M -24,-12 L -18,-32 L -8,-22 L 0,-42 L 8,-22 L 18,-32 L 24,-12 Q 12,-4 0,-4 Q -12,-4 -24,-12 Z"
          fill="url(#goldArch)" stroke="#78350f" stroke-width="0.8" />
    
    <!-- Third Eye (Trinayana) -->
    <path d="M 0,-18 Q 4,-12 0,-6 Q -4,-12 0,-18 Z" fill="#ef4444" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="0" cy="-12" r="1.4" fill="#fde047" />

    <!-- Iconic Durga Eyes -->
    <!-- Left Eye -->
    <path d="M -18,-1 C -12,5 -6,5 0,1 C -6,-3 -12,-3 -18,-1 Z" fill="#fffbeb" opacity="0.9" />
    <circle cx="-8" cy="1" r="2.4" fill="#1e1b18" />
    <circle cx="-7.5" cy="0.4" r="0.8" fill="#ffffff" />
    <!-- Left Eyelash Arc -->
    <path d="M -22,-4 Q -10,-1 0,1" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Right Eye -->
    <path d="M 18,-1 C 12,5 6,5 0,1 C 6,-3 12,-3 18,-1 Z" fill="#fffbeb" opacity="0.9" />
    <circle cx="8" cy="1" r="2.4" fill="#1e1b18" />
    <circle cx="8.5" cy="0.4" r="0.8" fill="#ffffff" />
    <!-- Right Eyelash Arc -->
    <path d="M 22,-4 Q 10,-1 0,1" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Nose Ring (Nath) Silhouette -->
    <circle cx="4" cy="13" r="6" fill="none" stroke="#fbbf24" stroke-width="1.1" />
    <circle cx="4" cy="19" r="1.2" fill="#ef4444" />
  </g>

  <!-- Left Traditional Diya (Oil Lamp) -->
  <g transform="translate(145, 275)">
    <!-- Diya Base -->
    <path d="M -18,12 Q 0,22 18,12 Q 14,3 0,4 Q -14,3 -18,12 Z" fill="#b45309" stroke="#f59e0b" stroke-width="0.8" />
    <!-- Flame -->
    <path d="M 0,2 Q 6,-8 0,-20 Q -6,-8 0,2 Z" fill="url(#flameGrad)" />
    <!-- Diya Glow -->
    <circle cx="0" cy="-7" r="14" fill="#fbbf24" opacity="0.22" />
  </g>

  <!-- Right Traditional Diya (Oil Lamp) -->
  <g transform="translate(455, 275)">
    <!-- Diya Base -->
    <path d="M -18,12 Q 0,22 18,12 Q 14,3 0,4 Q -14,3 -18,12 Z" fill="#b45309" stroke="#f59e0b" stroke-width="0.8" />
    <!-- Flame -->
    <path d="M 0,2 Q 6,-8 0,-20 Q -6,-8 0,2 Z" fill="url(#flameGrad)" />
    <!-- Diya Glow -->
    <circle cx="0" cy="-7" r="14" fill="#fbbf24" opacity="0.22" />
  </g>

  <!-- Festive Corner Alpana Flourishes -->
  <!-- Top Left -->
  <path d="M 16,16 Q 48,20 64,52 Q 32,36 16,16 Z" fill="#fbbf24" opacity="0.4" />
  <circle cx="28" cy="28" r="3" fill="#f59e0b" opacity="0.5" />
  <!-- Top Right -->
  <path d="M 584,16 Q 552,20 536,52 Q 568,36 584,16 Z" fill="#fbbf24" opacity="0.4" />
  <circle cx="572" cy="28" r="3" fill="#f59e0b" opacity="0.5" />

  <!-- Bottom Elegant Festive Title Tag -->
  <g transform="translate(300, 312)">
    <!-- Banner Pill -->
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="rgba(18, 2, 5, 0.85)" stroke="#f59e0b" stroke-width="1" />
    <text x="0" y="3.5" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fef08a" letter-spacing="1.5" text-anchor="middle">
      DIBRUGARH DURGO UTSAV 2026
    </text>
  </g>
</svg>
